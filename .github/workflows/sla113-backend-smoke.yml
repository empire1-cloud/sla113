name: SLA113 backend smoke

on:
  push:
    branches: [newest]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Import Vercel entrypoint
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: sla113_smoke
          JWT_SECRET_KEY: smoke-only-not-production
        run: |
          python - <<'PY'
          import server
          paths = {route.path for route in server.app.routes}
          assert '/api/health' in paths, sorted(paths)
          print('server:app import OK')
          print('/api/health route OK')
          PY
