<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample SLA113 Arcade Game</title>
    <style>
        body { margin: 0; padding: 0; background: #000; }
        #game-container { width: 800px; height: 600px; margin: 20px auto; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.js"></script>
</head>
<body>
    <div id="game-container"></div>
    <script>
        // Sample game showing how to use the asset pipeline
        class SampleGame extends Phaser.Scene {
            constructor() {
                super('SampleGame');
            }
            
            preload() {
                // Load the asset pack that was generated by our pipeline
                this.load.pack('game-assets', 'assets/arcade-pack.json');
                
                // Loading sprite for demo
                this.load.spritesheet('player', 'assets/generated/sprites/player.png', {
                    frameWidth: 32,
                    frameHeight: 48
                });
            }
            
            create() {
                // Add background
                this.add.image(400, 300, 'lobby-background').setScale(1.5);
                
                // Add title
                this.add.text(400, 100, 'SAMPLE ARCADE GAME', {
                    fontFamily: '"Dancing Script", cursive',
                    fontSize: '48px',
                    color: '#d4af37'
                }).setOrigin(0.5);
                
                // Add animated character from our sprite sheet
                const player = this.add.sprite(400, 300, 'player');
                player.setScale(2);
                
                // Create animation if we have the frames
                this.anims.create({
                    key: 'run',
                    frames: this.anims.generateFrameNumbers('player', { start: 0, end: 3 }),
                    frameRate: 10,
                    repeat: -1
                });
                
                player.play('run');
                
                // Add interactive elements from our UI atlas
                const playButton = this.add.sprite(400, 450, 'arcade-ui', 'play-button');
                playButton.setScale(1.5);
                playButton.setInteractive({ useHandCursor: true });
                
                playButton.on('pointerover', () => {
                    playButton.setTexture('arcade-ui', 'play-button-hover');
                });
                
                playButton.on('pointerout', () => {
                    playButton.setTexture('arcade-ui', 'play-button');
                });
                
                playButton.on('pointerdown', () => {
                    playButton.setTexture('arcade-ui', 'play-button-pressed');
                    // Game logic would go here
                    this.showMessage('Game Started!');
                });
                
                playButton.on('pointerup', () => {
                    playButton.setTexture('arcade-ui', 'play-button-hover');
                });
                
                // Add instruction text
                this.add.text(400, 520, 'Click PLAY to begin', {
                    fontFamily: '"Rajdhani", sans-serif',
                    fontSize: '24px',
                    color: '#ffffff'
                }).setOrigin(0.5);
            }
            
            showMessage(message) {
                // Remove any existing message
                this.children.each(child => {
                    if (child.name === 'message') child.destroy();
                });
                
                const msg = this.add.text(400, 350, message, {
                    fontFamily: '"Rajdhani", sans-serif',
                    fontSize: '32px',
                    color: '#00ff00'
                }).setOrigin(0.5).setName('message');
                
                // Fade out after 2 seconds
                this.tweens.add({
                    targets: msg,
                    alpha: 0,
                    duration: 2000,
                    ease: 'Power2',
                    onComplete: () => {
                        msg.destroy();
                    }
                });
            }
        }
        
        // Initialize the Phaser game
        const config = {
            type: Phaser.AUTO,
            width: 800,
            height: 600,
            backgroundColor: '#000000',
            scene: [SampleGame],
            parent: 'game-container',
            physics: {
                default: 'arcade',
                arcade: {
                    gravity: { y: 300 },
                    debug: false
                }
            }
        };
        
        const game = new Phaser.Game(config);
    </script>
</body>
</html>
